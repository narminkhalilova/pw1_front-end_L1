<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>quiz form</title>
<style>
/* same font everywhere, like in the course */
body, input, button, select, textarea {
  font-family: verdana;
  font-size: 1em;
}
/* label width, from the course slides */
.champ1 {
  display: inline-block;
  width: 120px;
}
/* fieldset style, from the course slides */
fieldset {
  width: 450px;
  border: 1px solid red;
  border-radius: 15px;
  margin: 5px 10px;
  line-height: 35px;
}
/* red border if bad, green if ok */
input[required]:invalid {
  border: 2px red solid;
}
input[required]:valid {
  border: 2px green solid;
}
</style>
</head>
<body>

<!-- title -->
<h1>html/css quiz</h1>

<!-- small explanation -->
<p>small quiz on html and css. fill the fields and press send.</p>

<!-- the form, data goes to the php script -->
<form action="senddata.php" method="post">

  <!-- student info -->
  <fieldset>
    <legend>contact</legend>

    <!-- lastname -->
    <label for="lastname" class="champ1">lastname</label>
    <input type="text" id="lastname" name="lastname" placeholder="your last name" required><br>

    <!-- firstname -->
    <label for="firstname" class="champ1">firstname</label>
    <input type="text" id="firstname" name="firstname" placeholder="your first name" required><br>

    <!-- email, pattern like in the slides -->
    <label for="email" class="champ1">email</label>
    <input type="email" id="email" name="email" placeholder="prefix@domain.topLevelDomain" pattern=".+@.+\..+" required><br>
  </fieldset>

  <!-- date of the quiz. no placeholder, w3c gives error on date. not everywhere supported (safari), so no required -->
  <label for="qdate" class="champ1">date</label>
  <input type="date" id="qdate" name="qdate"><br>

  <!-- single choice question () -->
  <span class="champ1">radio</span>
  <label for="radio1">radio 1</label>
  <input type="radio" name="radio" id="radio1" value="1" required>
  <label for="radio2">radio 2</label>
  <input type="radio" name="radio" id="radio2" value="2" required>
  <label for="radio3">radio 3</label>
  <input type="radio" name="radio" id="radio3" value="3" required><br>

  <!-- multiple choice question, name with [] so php gets an array -->
  <span class="champ1">checkbox</span>
  <label for="cb1">cb 1</label>
  <input type="checkbox" name="cb[]" id="cb1" value="1">
  <label for="cb2">cb 2</label>
  <input type="checkbox" name="cb[]" id="cb2" value="2">
  <label for="cb3">cb 3</label>
  <input type="checkbox" name="cb[]" id="cb3" value="3"><br>

  <!-- dropdown with groups, first empty option so required works -->
  <label for="listselect" class="champ1">select</label>
  <select name="listselect" id="listselect" required>
    <option value="">-- choose --</option>
    <optgroup label="group1">
      <option value="1.1">option 1.1</option>
      <option value="1.2">option 1.2</option>
    </optgroup>
    <optgroup label="group2">
      <option value="2.1">option 2.1</option>
      <option value="2.2">option 2.2</option>
    </optgroup>
  </select><br>

  <!-- textarea for code, not required -->
  <label for="code" class="champ1">comment</label>
  <textarea name="code" id="code" rows="5" cols="40" placeholder="put some html or css code here..."></textarea><br>

  <!-- submit button -->
  <p><button type="submit">send</button></p>

</form>

</body>
</html>
