<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>driving experience assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>driving experience assistant</h1>
</header>

<main>
<p>fill in the form to record a driving experience. all the fields are mandatory.</p>

<form>
<p>
<label for="iddate">date</label>
<input type="date" id="iddate" required>
</p>
<p>
<label for="idstart">start time</label>
<input type="time" id="idstart" required>
</p>
<p>
<label for="idend">end time</label>
<input type="time" id="idend" required>
</p>
<p>
<label for="idweather">weather</label>
<select id="idweather" required>
<option value="">-- choose --</option>
<option value="1">sunny</option>
<option value="2">cloudy</option>
<option value="3">windy</option>
<option value="4">rainy</option>
<option value="5">snowy</option>
<option value="6">foggy</option>
</select>
</p>
<p>
<label for="idroad">road type</label>
<select id="idroad" required>
<option value="">-- choose --</option>
<option value="1">city</option>
<option value="2">country road</option>
<option value="3">highway</option>
<option value="4">mountain road</option>
</select>
</p>
<p>
<label for="idtraffic">traffic</label>
<select id="idtraffic" required>
<option value="">-- choose --</option>
<option value="1">light</option>
<option value="2">moderate</option>
<option value="3">heavy</option>
</select>
</p>
<p>
<label for="idkm">mileage (km)</label>
<input type="number" id="idkm" min="0" step="0.1" inputmode="decimal" placeholder="12.5" required>
</p>
<p>
<button type="button" id="idsave">save</button>
</p>
</form>
</main>

<footer>
<p>author: your name here, ufaz l1 computer science</p>

</footer>

</body>
</html>
