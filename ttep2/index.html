<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="web form to record an accompanied driving experience">
<meta name="author" content="Narmin Khalilova">
<title>driving experience assistant</title>
<style>
/* same font everywhere, form fields too */
body, input, select, button {font-family: verdana, sans-serif; font-size: 1em;}
/* body is a column so the footer stays at the bottom of the screen */
body {margin: 0; min-height: 100vh; display: flex; flex-direction: column; background-color: #eeecf1; color: #2a2733;}
/* header and footer take the full width */
header, footer {background-color: #625b73; color: #ffffff; text-align: center; padding: 15px;}
header h1 {margin: 0; font-size: 1.4em;}
footer {font-size: 0.8em;}
footer p {margin: 5px 0;}
/* main is centered and small, good for a phone */
main {flex: 1; width: 100%; max-width: 500px; box-sizing: border-box; margin: 0 auto; padding: 0 15px 20px;}
form {background-color: #ffffff; border: 1px solid #9a93a8; border-radius: 4px; padding: 15px;}
.note {margin: 0 0 15px; font-size: 0.85em; color: #4f4960;}
/* groups of fields */
fieldset {min-width: 0; margin: 0 0 15px; padding: 10px 15px 3px; border: 1px solid #cfcad8; border-radius: 4px;}
legend {padding: 0 5px; color: #4f4960;}
/* on a phone the label is above the field */
.field {display: grid; grid-template-columns: 1fr; margin-bottom: 12px;}
label {margin-bottom: 5px;}
input, select {width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #9a93a8; border-radius: 3px; background-color: #ffffff;}
input:focus, select:focus {outline: 2px solid #625b73; outline-offset: 1px;}
button {width: 100%; padding: 12px; background-color: #625b73; color: #ffffff; border: none; border-radius: 3px; cursor: pointer;}
button:hover, button:focus {background-color: #4f4960;}
/* on a bigger screen the label goes on the left */
@media (min-width: 600px) {
  .field {grid-template-columns: 140px 1fr; align-items: center;}
  label {margin-bottom: 0;}
}
</style>
</head>
<body>

<header>
<h1>driving experience assistant</h1>
</header>

<main>
<section>
<h2>new driving experience</h2>
<form>
<p class="note">all fields are required</p>

<fieldset>
<legend>date and time</legend>

<div class="field">
<label for="date">date</label>
<input type="date" id="date" required>
</div>

<div class="field">
<label for="startingTime">start time</label>
<input type="time" id="startingTime" required>
</div>

<div class="field">
<label for="endingTime">end time</label>
<input type="time" id="endingTime" required>
</div>

</fieldset>

<fieldset>
<legend>driving conditions</legend>

<div class="field">
<label for="idWeather">weather</label>
<select id="idWeather" name="idWeather" required>
<option value="">-- choose --</option>
<option value="1">sunny</option>
<option value="2">rainy</option>
<option value="3">cloudy</option>
<option value="4">windy</option>
<option value="5">foggy</option>
<option value="6">snowy</option>
<option value="7">stormy</option>
</select>
</div>

<div class="field">
<label for="idRoad">road type</label>
<select id="idRoad" name="idRoad" required>
<option value="">-- choose --</option>
<option value="1">city</option>
<option value="2">highway</option>
<option value="3">mountain</option>
<option value="4">countryside</option>
</select>
</div>

<div class="field">
<label for="idManoeuvre">special manoeuvre</label>
<select id="idManoeuvre" name="idManoeuvre" required>
<option value="">-- choose --</option>
<option value="1">parking</option>
<option value="2">reversing</option>
<option value="3">roundabout</option>
<option value="4">hill start</option>
<option value="5">overtaking</option>
<option value="6">emergency stop</option>
</select>
</div>

</fieldset>

<fieldset>
<legend>mileage</legend>

<div class="field">
<label for="distance">distance (km)</label>
<input type="number" id="distance" min="0" max="2000" step="0.1" inputmode="decimal" placeholder="35" required>
</div>

</fieldset>

<button type="button">save</button>

</form>
</section>
</main>

<footer>
<p>author: Narmin Khalilova, UFAZ Baku, l1 front-end 2026</p>
<p>&copy; 2026 Narmin Khalilova, all rights reserved</p>
</footer>

</body>
</html>
